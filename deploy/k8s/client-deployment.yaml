apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerpilot-client
  namespace: careerpilot
  labels:
    app: careerpilot
    component: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careerpilot
      component: client
  template:
    metadata:
      labels:
        app: careerpilot
        component: client
    spec:
      containers:
      - name: client
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/careerpilot-client:latest # REPLACED BY CI/CD
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
