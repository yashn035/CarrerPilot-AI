apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerpilot-server
  namespace: careerpilot
  labels:
    app: careerpilot
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careerpilot
      component: server
  template:
    metadata:
      labels:
        app: careerpilot
        component: server
    spec:
      containers:
      - name: server
        image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/careerpilot-server:latest # REPLACED BY CI/CD
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: careerpilot-secrets
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: careerpilot-secrets
              key: redis-url
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: careerpilot-secrets
              key: gemini-api-key
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
