services:
  - type: web
    name: careerpilot-web
    env: docker
    dockerfilePath: ./Dockerfile.server
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: REDIS_URL
        fromService:
          type: redis
          name: careerpilot-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PISTON_FALLBACK_ENABLED
        value: "true"
      - key: USE_LOCAL_SANDBOX
        value: "true"
      - key: SEMANTIC_CACHE_ENABLED
        value: "true"

  - type: redis
    name: careerpilot-redis
    plan: free
    ipAllowList: [] # only allow internal connections
